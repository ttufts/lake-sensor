views:
  - title: Lake Monitor
    path: overview
    icon: mdi:waves
    cards:
      - type: grid
        title: Current Conditions
        columns: 2
        square: false
        cards:
          - type: gauge
            entity: sensor.lake_monitor_node_1_lake_level
            name: Lake Level
            needle: true
            min: 0
            max: 16.5
          - type: gauge
            entity: sensor.lake_monitor_node_1_temperature
            name: Water Temperature
            needle: true
            min: 32
            max: 100
      - type: history-graph
        title: Lake Level — Last 72 Hours
        hours_to_show: 72
        refresh_interval: 60
        entities:
          - entity: sensor.lake_monitor_node_1_lake_level
            name: Lake Level
      - type: history-graph
        title: Temperature — Last 72 Hours
        hours_to_show: 72
        refresh_interval: 60
        entities:
          - entity: sensor.lake_monitor_node_1_temperature
            name: Temperature
      - type: statistics-graph
        title: Lake Level — 30 Day Trend
        days_to_show: 30
        period: hour
        chart_type: line
        stat_types: [min, mean, max]
        entities:
          - entity: sensor.lake_monitor_node_1_lake_level
            name: Lake Level
      - type: statistics-graph
        title: Temperature — 30 Day Trend
        days_to_show: 30
        period: hour
        chart_type: line
        stat_types: [min, mean, max]
        entities:
          - entity: sensor.lake_monitor_node_1_temperature
            name: Temperature
      - type: entities
        title: Sensor and Radio Diagnostics
        show_header_toggle: false
        entities:
          - entity: sensor.lake_monitor_node_1_battery_voltage
            name: Battery Voltage
          - entity: sensor.lake_monitor_node_1_loop_current
            name: Loop Current
          - entity: sensor.lake_monitor_node_1_lora_rssi
            name: LoRa RSSI
          - entity: sensor.lake_monitor_node_1_lora_snr
            name: LoRa SNR
          - entity: sensor.lake_monitor_node_1_status_flags
            name: Status Flags
          - entity: sensor.lake_monitor_node_1_sequence
            name: Packet Sequence
